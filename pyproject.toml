[project]
name = "bybit-mantle-arbitrage-monitor"
version = "0.1.0"
description = "Bybit spot ⇄ Fluxion (Mantle) tokenized-stocks live panel; phase-1 WMNT/USDT0 backtest archived under src/mba"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27",
    "eth-abi>=5.1",
    "eth-utils>=4.1",
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "matplotlib>=3.8",
    "eth-hash[pycryptodome]>=0.7",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "websockets>=17.0.1",
    "textual>=8.2.8",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mba", "src/monitor"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
# Expand as phase-2 modules land (see docs/DESIGN.md §4.2):
files = ["src/mba", "src/monitor"]
