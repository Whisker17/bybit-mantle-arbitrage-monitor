[project]
name = "mba"
version = "0.1.0"
description = "Mantle <> Bybit arbitrage feasibility backtest (WMNT/USDT0)"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27",
    "eth-abi>=5.1",
    "eth-utils>=4.1",
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "matplotlib>=3.8",
    "eth-hash[pycryptodome]>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mba"]
