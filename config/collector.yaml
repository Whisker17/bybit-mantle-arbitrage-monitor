# Live collector tunables — M2 / WHI-731; multi-market sections M7-2 / WHI-771.
# Secrets (RPC key) stay in .env; this file is checked-in non-secret config.
#
# Schema v2: shared logging/retention + per-market venue blocks under `markets:`.
# CLI: `python -m monitor.collector --market bybit-fluxion` (default).
# Journal path convention: data/monitor-{market}.db (ADR-0001). Legacy
# data/monitor.db is still accepted as a fallback for the default market only.

version: 2

logging:
  level: INFO

# Default retention (WHI-751). Per-market override: markets.<id>.retention.
# Bounds SQLite growth on small VPS disks. Derivation: docs/DESIGN.md §5.1.
retention:
  enabled: true
  # Collector background interval; also run once via `python -m monitor.retention`.
  interval_s: 3600
  # Raw TTLs (milliseconds from now). null = never prune.
  # bybit_book is the bulk; keep ≥ max(TUI edge_history cold-start, sparkline).
  bybit_book_raw_ms: 172800000      # 2 days raw L1
  bybit_book_1m_ms: 1209600000      # 14 days of 1-minute bars after downsample
  bybit_depth_ms: 172800000         # 2 days precomputed VWAP curves (WHI-755)
  bybit_trades_ms: 604800000        # 7 days (≥ TUI 24h volume window)
  fluxion_pool_state_ms: 604800000  # 7 days (edge rebuild / sparkline)
  fluxion_rfq_quotes_ms: 259200000  # 3 days
  fluxion_swaps_ms: null            # permanent — M4 attribution feedstock
  fluxion_rfq_fills_ms: null        # permanent — M4 attribution feedstock
  collector_gaps_ms: 2592000000     # 30 days
  delete_batch_size: 5000
  # After DELETE, free pages for reuse; pages=0 skips. Full VACUUM is opt-in.
  incremental_vacuum_pages: 1000
  full_vacuum: false
  disk:
    # Free-space probe path; null = parent directory of sqlite_path.
    path: null
    warn_free_bytes: 2147483648       # 2 GiB — accelerate TTLs
    critical_free_bytes: 1073741824   # 1 GiB — emergency TTLs + pause book writes
    warn_ttl_factor: 0.25
    critical_ttl_factor: 0.05
    pause_book_writes_on_critical: true

markets:
  # --- Bybit ⇄ Fluxion xStocks (default / live today) ---
  bybit-fluxion:
    sqlite_path: data/monitor-bybit-fluxion.db
    bybit:
      # Public spot multiplexed stream.
      ws_url: "wss://stream.bybit.com/v5/public/spot"
      # Multi-level book (WHI-755). L1 still derived from best bid/ask and written
      # to bybit_book; precomputed bucket VWAPs go to bybit_depth. orderbook.1 still
      # works if you need L1-only (depth.enabled false).
      book_topic_prefix: "orderbook.50"
      trade_topic_prefix: "publicTrade"
      reconnect_min_s: 1.0
      reconnect_max_s: 60.0
      # After reconnect, mark book/trade ticks as gap=1 for this many seconds.
      post_reconnect_gap_s: 5.0
      # Ping interval recommended by Bybit (~20s).
      ping_interval_s: 20.0
      depth:
        enabled: true
        # Throttle depth journal rows per symbol (L1 bybit_book is unthrottled).
        emit_interval_ms: 1000
        # Also flush when mid moves by ≥ this many bps since last depth row.
        mid_change_bps: 1
        # PnL v2 AMM ladder (DESIGN §2.6.3) — de-multiplied USD notional.
        buckets_usd: ["10", "50", "100", "500", "1000", "10000"]

    mantle:
      public_rpc_url: "https://rpc.mantle.xyz"
      multicall3: "0xca11bde05977b3631167028862be2a173976ca11"
      # Poll head; Mantle block time ≈ 2s. 0.25s is the measured sweet spot (WHI-749);
      # 0.10s increases block-not-found retries without a useful P95 win.
      block_poll_interval_s: 0.25
      # Stay 1 block behind tip to cut lag=0 catch-up P95 tails (WHI-749 / phase-1
      # HEAD_LAG lesson). Transient "block N not found" can still occur on multi-
      # backend keyed LB; poller retries the same N (no skip). Raise to 2 if gap
      # noise is operationally loud. Cost: ~+2s systematic block_ts→recv lag.
      head_lag_blocks: 1
      # If head advances more than this beyond last processed, flag gap on subsequent rows.
      max_block_gap: 1
      # Far-behind jump window (no historical backfill beyond this many tip blocks).
      max_catchup_blocks: 15
      rpc_min_interval_s: 0.05
      rpc_timeout_s: 30.0
      rpc_retries: 5
      # Fetch gasUsed + effectiveGasPrice for swap txs (xStock pools are quiet).
      fetch_swap_receipts: true
      # Equal-weight samples for meta block_ingest_latency_{p50,p95,p99}_ms.
      latency_window_blocks: 256

    rfq:
      # Notional for EXACT_INPUT quote polls (USDC has 6 decimals). 100 USDC.
      amount_usdc_raw: "100000000"
      # Sell-native leg size in native raw (18 dec). 0.1 token ≈ mid-size RFQ sample.
      amount_native_raw: "100000000000000000"
      # Prefer same-origin proxy; fall back to upstream on non-2xx / transport error.
      prefer_primary_url: true
      # Poll both buy (USDC→native) and sell (native→USDC) legs for each pair.
      poll_both_sides: true
      # HTTP timeout for quote POSTs.
      http_timeout_s: 20.0

  # --- Binance ⇄ PancakeSwap bStocks (scaffold for M7-3 / WHI-772) ---
  # Inventory: config/markets/binance-pancake.yaml. Collector process not wired yet.
  binance-pancake:
    sqlite_path: data/monitor-binance-pancake.db
    # Venue blocks below are loadable hints for M7-3; not consumed by
    # load_collector_config → CollectorConfig (Bybit-shaped) until that issue.
    binance:
      # US VPS: api.binance.com returns 451 — use vision hosts (WHI-770).
      rest_base_url: "https://data-api.binance.vision"
      ws_base_url: "wss://data-stream.binance.vision"
      book_topic_prefix: "depth"
      trade_topic_prefix: "trade"
      reconnect_min_s: 1.0
      reconnect_max_s: 60.0
      post_reconnect_gap_s: 5.0
      ping_interval_s: 20.0
    bsc:
      public_rpc_url: "https://bsc-dataseed.binance.org"
      multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"
      # BSC ~3s blocks; poll budget ~4× Mantle if head-following every block.
      block_poll_interval_s: 0.5
      head_lag_blocks: 1
      max_block_gap: 1
      max_catchup_blocks: 15
      rpc_min_interval_s: 0.05
      rpc_timeout_s: 30.0
      rpc_retries: 5
      fetch_swap_receipts: true
      latency_window_blocks: 256
