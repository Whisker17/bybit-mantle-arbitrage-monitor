# Market: Bybit ⇄ Fluxion xStocks — M7-2 / WHI-771 schema v2.
# Inventory body under `inventory:` is the former config/pairs.yaml (M1 / WHI-730).
# Multipliers: Bybit xstockMultiplier — apply with de_multiplied_price (divide).
# Costs feed metrics/PnL v2 assembly (cex_taker_fee_bps → MetricsConfig.bybit_taker_fee_bps).
# See docs/adr/0001-per-market-sqlite.md and docs/references/m1-xstocks-inventory.md.

version: 2
id: bybit-fluxion
display_name: Bybit ⇄ Fluxion (xStocks)
cex:
  venue: bybit
  quote_asset: USDT
  multiplier_semantics: divide
  rest_base_url: https://api.bybit.com
  ws_base_url: wss://stream.bybit.com
dex:
  venue: fluxion
  chain_id: 5000
  pool_kind: v3
  quote_asset: USDC
  quote_decimals: 6
  has_rfq: true
costs:
  # Bybit xStocks "Adventure Zone" tier: maker = taker = 20 bps (no maker discount).
  # Measured 2026-08-07 via authenticated GET /v5/account/fee-rate for
  # HOODXUSDT / CRCLXUSDT / NVDAXUSDT. Cited from sibling bot repo
  # mantle-stocks-arbitrage-bots (config/thresholds.yaml + that repo's DESIGN §2.3).
  # Standard-spot 10 bps does not apply.
  cex_taker_fee_bps: 20
  gas_usd_per_swap: 0.01
  # Signed USDC premium over USDT (bps; positive = USDC richer). Bybit xStocks
  # quote USDT while Fluxion AMM/RFQ quote USDC. Measured ~7.5 bps: Bybit
  # USDCUSDT trades ~1.0007–1.0008. Corroborating snapshot in sibling bot repo
  # mantle-stocks-arbitrage-bots (DESIGN §2.3 + that repo's
  # docs/references/m1-stable-rail-and-xstocks-latency.md — pool mid 1.00074,
  # book 1.0007–1.0008). Engine signs by direction (WHI-960): + when paying
  # USDC, − when receiving. Live per-timestamp feed still open.
  quote_basis_bps: 7.5
  # Direction-1 capital return is stables on Mantle — measured free
  # (GET /v5/asset/coin/query-info, 2026-08-07). Direction-2 uses per-pair
  # asset_withdrawal_fee_tokens (WHI-961).
  stable_withdrawal_fee_usd: 0
# WHI-821: omit quote_max_age_ms → inherit config/api.yaml default (300s).
# Override only when a market needs a different quiet-book window (see
# binance-pancake.yaml for closed-session bStocks).
