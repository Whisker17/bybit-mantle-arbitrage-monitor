# Metrics / paper-edge tunables — M3 / WHI-732.
# Secrets stay in .env; this file is checked-in non-secret config.
# Values trace to docs/DESIGN.md §2.3–2.4 and Linear WHI-732.

version: 1

# Notional ladder for wear + net edge (USD). Issue WHI-732: $1K / $5K / $20K.
size_ladder_usd:
  - 1000
  - 5000
  - 20000

# Bybit xStocks Adventure Zone taker (DESIGN §1.2 / §2.3). 0.20% = 20 bps.
# Base default matches bybit-fluxion (default market). Per-market costs override
# via apply_market_costs — binance-pancake stays at 10 bps in its market file.
# Provenance: authenticated GET /v5/account/fee-rate 2026-08-07 (HOODX/CRCLX/NVDAX).
bybit_taker_fee_bps: 20

# Signed USDC premium over USDT, in bps (positive = USDC richer). Base default
# 0; bybit-fluxion overrides via costs.quote_basis_bps (measured ~7.5). Engine
# applies sign by direction (WHI-960 / DESIGN §2.6.2) — not additive both ways.
usdt_usdc_basis_bps: 0

# Mantle gas for one V3 swap, USD (gasUsed * baseFee + OP-Stack L1 data fee).
# Phase-1 measured ~$0.004–0.007; pad slightly for quiet xStock pools.
gas_usd_per_swap: 0.01

# US equity regular session (America/New_York). Holidays + early closes are
# encoded in monitor.metrics.session (NYSE calendar, not exchange_calendars dep).
session:
  timezone: America/New_York
  open: "09:30"
  close: "16:00"
  # NYSE early-close days end at 13:00 ET.
  early_close: "13:00"

# Cost floor for "breach" stats: net edge > 0 after full wear at this ladder size.
# Using the smallest rung keeps the floor conservative for duration counting.
# EdgeStats.observe_edge only counts breaches for results at this size.
breach_size_usd: 1000

# Inter-sample gaps larger than this (ms) do not add to breach duration —
# overnight / reconnect / gap=1 windows must not inflate open-session totals.
max_breach_gap_ms: 300000

# WHI-822 / WHI-964: |AMM mid − CEX mid| / CEX mid in bps. Beyond this the pair
# is marked pricing_anomaly — mid/spread stay visible for investigation, but
# PnL v2 must not claim a fillable optimal and Top-N seats are denied
# (DESIGN §2.9). Value 300 tracks the executing bot's tradability gate
# (mantle-stocks-arbitrage-bots config/thresholds.yaml
# costs.max_abs_amm_spread_bps) — bot is the source of truth; when that moves,
# move this. Guard remains process-global across markets (WHI-822); no
# per-market override. null = disable.
max_abs_amm_spread_bps: 300

# PnL v2 cash-flow engine (WHI-756 / DESIGN §2.6). Separate from M3 TUI ladder.
pnl_v2:
  # Fixed AMM bucket table (USD notional at de-multiplied Bybit mid).
  buckets_usd: [10, 50, 100, 500, 1000, 10000]
  q_min_usd: 10
  config_cap_usd: 10000
  coarse_points: 24
  refine_points: 16
  q_tol_rel: "1e-6"
  amm_solve_max_iters: 64
  amm_cap_max_iters: 24
  # Highlight thresholds only — raw PnL is never clamped.
  # Bot floor 1.5 USDT (sibling mantle-stocks-arbitrage-bots thresholds).
  # null would degrade to pnl_usd > 0 (any cent highlights) — WHI-962.
  min_profit_usd: 1.5
  min_profit_bps: null
  # Sequential-execution bar: net ≥ k × σ_transit (bot drift_premium_k 1.5).
  # σ is per-pair inventory (WHI-915 / m8-delay-decay.md @10m). WHI-962.
  drift_premium_k: "1.5"
  gas_on_rfq: true
  # Optional soft L1 depth cap; null = infinite (L1 never size-unfillable).
  l1_assumed_size_usd: null
