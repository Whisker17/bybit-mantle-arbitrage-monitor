# Underlying equity price feeds — WHI-778.
# Research + decision: docs/references/underlying-price-source.md
# Secrets: none for Pyth Hermes. Optional future keys stay in .env.

version: 1

# Hermes public HTTP (no API key). Override only for mirrors / staging.
hermes_base_url: "https://hermes.pyth.network"

# Poll cadence (collector loop). Open uses RTH calendar from metrics session.
open_poll_interval_s: 30.0
closed_poll_interval_s: 300.0
http_timeout_s: 20.0

# price_type thresholds (ms).
# During RTH: as_of older than this → stale (missed updates).
stale_after_open_ms: 120000
# Absolute max age ever: dead feeds (e.g. abandoned KR print) → stale always.
stale_after_abs_ms: 604800000  # 7d
# When classifying close vs stale outside RTH: last close older than this → stale.
stale_after_closed_ms: 432000000  # 5d (covers long weekends + one holiday)

# Yahoo chart API fallback for tickers Pyth cannot serve (SKHY ADR today).
# Unofficial; disable for compliance-strict deploys.
yahoo_fallback: true
yahoo_chart_base_url: "https://query1.finance.yahoo.com"
# Optional Pyth FX.USD/KRW for Yahoo KRW quotes. Null while no prefer_yahoo
# ticker quotes KRW (SKHY is USD ADR — WHI-785). Re-enable when adding a KR
# listing, e.g. e539120487c29b4defdf9a53d337316ea022a2688978a468f9efd847201be7e3
fx_usd_krw_feed_id: null

# WHI-787: periodic re-check of tickers marked uncovered. When Yahoo/Pyth
# later list a "private" name, WARN + /api/health surfaces a mismatch so the
# config flag is not permanent without review.
uncovered_probe_interval_s: 3600.0

# NYSE RTH hours — keep in sync with config/metrics.yaml session (file-level
# independence so underlying loads without metrics; DEFERRED_ISSUES WHI-778).
session:
  timezone: America/New_York
  open: "09:30"
  close: "16:00"
  early_close: "13:00"

