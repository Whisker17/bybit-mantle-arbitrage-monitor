# DRAFT — M7-1 / WHI-770 inventory for Binance spot ⇄ PancakeSwap (BSC) bStocks.
# Schema is isomorphic to config/pairs.yaml so M7-2 multi-market work can absorb it
# with minimal rename. NOT loaded by any runtime yet (M7-2 owns schema v2 + loaders).
#
# Overlap rule: Binance USDT spot bStock ∩ on-chain-verified Pancake V3 USDT pool.
# Rank: top 10 by DexScreener liquidity.usd on the verified pool (2026-08-02).
# ui_multiplier: BEP-677 uiMultiplier()/1e18 snapshot — APPLY BY MULTIPLYING Binance mid
#   (amm_raw ≈ binance_display * ui_multiplier). Do NOT reuse Bybit de_multiplied_price
#   (which divides). Field name is deliberately ui_multiplier, not multiplier.
# Endpoints / taker fees: not in this file (pairs.yaml holds neither) — see inventory note
#   § Geo (vision bases) and § Fees; M7 metrics/collector configs own those knobs.
# See docs/references/m7-bstocks-inventory.md.

