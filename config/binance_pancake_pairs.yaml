# DRAFT — M7-1 / WHI-770 inventory for Binance spot ⇄ PancakeSwap (BSC) bStocks.
# Schema is isomorphic to config/pairs.yaml so M7-2 multi-market work can absorb it
# with minimal rename. NOT loaded by any runtime yet (M7-2 owns schema v2 + loaders).
#
# Overlap rule: Binance USDT spot bStock ∩ on-chain-verified Pancake V3 USDT pool.
# Rank: top 10 by DexScreener liquidity.usd on the verified pool (2026-08-02).
# Multipliers: BEP-677 uiMultiplier() snapshot (1e18 scale → float here); refresh live.
# See docs/references/m7-bstocks-inventory.md for method, geo-block, and pricing formula.
#
# Pricing (≠ Bybit xStocks):
#   comparable_binance_as_raw = binance_mid * ui_multiplier
#   (AMM trades raw units; Binance prices display units when mult ≠ 1)

version: 1
market: binance_pancake
inventory_as_of: "2026-08-02"
# Same dollar gate as M1 for low_liquidity flag (inventory convention).
low_liquidity_threshold_usd: 50000

contracts:
  chain_id: 56
  # PancakeSwap V3 (BSC) — official addresses
  pancake_v3_factory: "0x0BFbCF9fa4f9C56B0F40a671Ad40E0805A091865"
  # Same CREATE2 multicall used across EVM chains
  multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"
  usdt: "0x55d398326f99059fF775485246999027B3197955"

# No RFQ / quote-vendor layer on Pancake Stocks Terminal (AMM-only). Kept explicit
# so M7-2 does not invent a Fluxion-shaped rfq: block by accident.
rfq:
  mode: none

binance:
  # From US VPS (RackNerd 107.175.234.202): api.binance.com / stream.binance.com → HTTP 451.
  # Market-data mirror works — use these bases for the collector on that host (M7-6).
  rest_base_url: "https://data-api.binance.vision"
  ws_base_url: "wss://data-stream.binance.vision"
  # Non-US hosts may use api.binance.com + stream.binance.com instead.
  restricted_rest_base_url: "https://api.binance.com"
  restricted_ws_base_url: "wss://stream.binance.com:9443"
  quote_asset: USDT
  # Paper-edge floor: base spot taker (BNB discount ignored).
  taker_fee_bps: 10

pancake:
  # PCS V3 Swap includes protocolFees — use TOPIC0_V3_SWAP_PCS (see monitor.fluxion.abi).
  swap_event: pancake_v3_protocol_fees
  quote_token: USDT
  quote_token_address: "0x55d398326f99059fF775485246999027B3197955"

