# Fixed monitor pair list — M1 / WHI-730 inventory.
# Source of truth for which Bybit ⇄ Fluxion xStock pairs the live panel tracks.
# Multipliers below are a snapshot from Bybit instruments-info (xstockMultiplier);
# M2 may refresh live. Liquidity estimates are inventory-time snapshots, not live TVL.
#
# Overlap rule: Bybit spot symbolType=xstocks ∩ Mantle native xStock (Backed Assets API).
# Low-liquidity flag: est AMM TVL < low_liquidity_threshold_usd, or no AMM pool found.
# RFQ conclusion: public EXACT_INPUT quote is pollable (see docs/references/m1-rfq-feasibility.md).
# Quote basis: Bybit legs are USDT; Fluxion AMM/RFQ are USDC — treat as ~1 until M3 models basis.

version: 1
inventory_as_of: "2026-07-31"
# Matches Fluxion's published AMM LP gate for route selection.
low_liquidity_threshold_usd: 50000

contracts:
  chain_id: 5000
  fluxion_v3_factory: "0xF883162Ed9c7E8EF604214c964c678E40c9B737C"
  fluxion_v3_quoter: "0x3E4eE18Ac7280813236a1EB850679Da5322E14CE"
  fluxion_v3_router: "0x5628a59dF0ECAC3f3171f877A94bEb26BA6DFAa0"
  limit_order_protocol: "0x11de6011345586785810e52448a44c6595eedc18"
  usdc: "0x09Bc4E0D864854c6aFB6eB9A9cdF58aC190D0dF9"
  usdt0: "0x779Ded0c9e1022225f8E0630b35a9b54bE713736"

rfq:
  # M1 decision for M2 collectors + TUI RFQ column (DESIGN §2.2 / §8).
  mode: pollable_quote
  quote_url: "https://fluxion.network/api/limit-order/quote"
  proxy_quote_url: "https://fluxion-proxy-api-production.up.railway.app/quote"
  request_type: EXACT_INPUT
  quote_asset: USDC
  # Global process budget from Fluxion (applies to both quote URLs; do not exceed).
  rate_limit_per_minute: 60
  # Minimum seconds between successive RFQ quote calls for the *same* pair, and
  # the cadence for round-robin across all pairs: ceil(60 * N / rate_limit) with
  # N=11 → 11s (exactly fills 60/min if every pair is polled each cycle).
  min_poll_interval_s: 11
  # Settlement: RFQ-priced orders fill through Fluxion Limit Order Protocol on Mantle.
  settlement: limit_order_protocol

