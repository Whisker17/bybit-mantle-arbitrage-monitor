# Read-only web API tunables — WHI-757.
# Secrets stay in .env; this file is checked-in non-secret config.
# FastAPI reads the collector SQLite journal (same path as TUI / collector).

version: 1

# Bind address for uvicorn (systemd / local). Nginx reverse-proxies /api here.
host: 127.0.0.1
port: 8000

# Default market for *legacy unscoped* routes (/api/pairs, /api/health) and
# the sqlite_path override below (M7-2 / WHI-771 / WHI-774). The API opens
# *all* config/markets/* journals; --market only selects this default.
# Per-market path convention: data/monitor-{market}.db.
# Relative paths resolve against the process cwd (repo root / deploy root).
# Legacy data/monitor.db still falls back for bybit-fluxion when the
# configured file is missing (see resolve_market_sqlite).
market: bybit-fluxion
sqlite_path: data/monitor-bybit-fluxion.db

# Health: freshest recv_ts older than this → collector_alive=false.
# Process liveness only — NOT a per-symbol quote wipe gate (WHI-821).
# 30s covers Bybit L1 (~1s) and RFQ poll stalls; chain can be quieter.
collector_stale_ms: 30000

# PnL v2 quote annotation (WHI-821): CEX book / pool / depth recv age above
# this → quote_aged=true + ages exposed on the snapshot. Tables still compute.
# Quiet event-driven bookTicker (price flat, no push) is normal closed-session
# behavior — 5m is intentionally looser than collector_stale_ms.
quote_max_age_ms: 300000

# Health: list gaps whose gap_end_ms falls inside this trailing window.
recent_gap_window_ms: 300000

# Health: RFQ poll error-rate window (WHI-974). Group-by on fluxion_rfq_quotes
# http_status over this trailing ms; 15m catches rising 451 without journald.
rfq_error_window_ms: 900000

# Recommended client poll interval (seconds). Documented in OpenAPI / frontend;
# the API itself is request/response only (no SSE in v1).
poll_interval_s: 2.0

# PnL v2 (WHI-766): process-local TTL for pair bucket/optimal snapshots.
# Slightly above poll_interval_s so a steady 2s poller still hits cache on the
# next tick (same-wall-clock expiry would force a miss every poll). Overview +
# detail concurrent polls also share one optimal-size search per pair.
# 0 = recompute every request (tests).
pnl_cache_ttl_s: 2.5

# Capture rate (WHI-963): longer TTL — trailing-window single-flight is heavy
# (hours of journal samples per pair). 30s keeps Cap $/d fresh enough for
# "how much could a night have earned" while protecting the §2.6.7 P95 budget
# on the 1 GB VPS. 0 = recompute every request (tests).
capture_cache_ttl_s: 30

# MM panel (WHI-769): overview badge lookback + inventory series / rebalance caps.
# Inventory ledger events are TTL-cached (same idea as pnl_cache) so /api/pairs
# + detail + /mm do not each re-scan 50k+ journal rows under the process lock.
mm_active_window_ms: 86400000   # 24h
mm_series_max_points: 500
mm_rebalance_limit: 100
mm_inventory_cache_ttl_s: 2.5   # 0 = rebuild every request

# CORS origins for local Next dogfood (NEXT_PUBLIC_API_BASE → :8000 is
# cross-origin). Empty list is correct on the VPS (nginx same-origin).
# Without these, the browser reports "API unreachable / Failed to fetch".
cors_origins:
  - "http://127.0.0.1:3000"
  - "http://localhost:3000"
