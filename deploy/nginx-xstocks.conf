# nginx site: static Next.js export + /api reverse-proxy (WHI-757).
# Install on the VPS (paths are examples — edit server_name / root / upstream):
#   sudo cp deploy/nginx-xstocks.conf /etc/nginx/sites-available/xstocks
#   sudo ln -sf /etc/nginx/sites-available/xstocks /etc/nginx/sites-enabled/xstocks
#   sudo nginx -t && sudo systemctl reload nginx
#
# Static files come from `web/out` via scripts/deploy-web.sh.
# API is uvicorn on 127.0.0.1:8000 (see config/api.yaml + xstocks-api.service).

upstream xstocks_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    # listen 443 ssl http2;  # enable TLS when certs are ready
    server_name _;  # replace with your VPS hostname / IP

    # Static export from Next.js (`output: "export"` → web/out).
    root /opt/xstocks/www;
    index index.html;

    # Long-cache hashed assets; HTML stays short-lived for redeploys.
    location /_next/static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Read-only JSON API (FastAPI / OpenAPI under /docs, /openapi.json).
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for upstream keepalive pool (else Connection: close).
        proxy_set_header Connection "";
        proxy_pass http://xstocks_api;
    }

    # OpenAPI UI + schema (handy on the VPS for dogfood).
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_pass http://xstocks_api;
    }

    # No access logs for static assets if desired:
    # access_log off;
}
